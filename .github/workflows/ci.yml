name: CI

on:
  pull_request:
    branches: [main, dev, 'release-version-bump-*']
  push:
    branches: [main, dev, hotfix]
  workflow_dispatch:

# One CI run per branch. When two PRs merge into dev seconds apart, the first
# push's run is superseded by the second — whose tip already contains both
# commits — so cancelling it drops a redundant Analyze+Test and, with it, the
# second `Promote dev → main` job that used to race the first.
#
# main is deliberately excluded (run_id makes every main run its own group).
# Grouping main would let GitHub cancel a *pending* run when a newer one
# arrives, and every release/deploy job below filters on `HEAD~1..HEAD` — a
# dropped run's commit would then never ship.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'shared' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze_format:
    name: Analyze & Format
    runs-on: ubuntu-latest
    # Skip on direct pushes to main: the dev→main promotion is the exact same
    # tree that already passed these checks on dev (and again on the promotion
    # PR). Re-running here only adds latency before release/deploy. Still runs
    # on every PR (incl. dev→main) and on pushes to dev/hotfix.
    if: github.ref != 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          # Need history for the food-db asset/_dbFilename bump check below.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> .env


      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Check formatting
        run: dart format --output none --set-exit-if-changed .

      # Guards against the most common food-DB regression: editing the
      # bundled asset without bumping _dbFilename, which leaves existing
      # installs stuck on the cached old DB until they reinstall.
      - name: Verify food DB asset/_dbFilename pair
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base" HEAD | grep -q '^assets/food_db\.sqlite$'; then
            if ! git diff "$base" HEAD -- lib/services/food_db_service.dart | grep -qE '^[-+].*_dbFilename'; then
              echo "::error file=assets/food_db.sqlite::assets/food_db.sqlite changed but _dbFilename was not bumped in lib/services/food_db_service.dart"
              echo "Bump _dbFilename (e.g. food_db_v9 -> food_db_v10) so existing installs replace their cached copy on next launch. Otherwise users keep the OLD database forever."
              exit 1
            fi
            echo "OK: asset bump is paired with a _dbFilename change."
          else
            echo "OK: food DB asset unchanged."
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    # See analyze_format: skipped on push to main (already validated via the
    # dev→main promotion PR), still runs on PRs and dev/hotfix pushes.
    if: github.ref != 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> .env


      - name: Run tests
        run: flutter test test/ --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
        continue-on-error: true

  promote_hotfix:
    name: Promote hotfix → main + dev
    runs-on: ubuntu-latest
    needs: [analyze_format, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/hotfix'
    # Only one hotfix promotion at a time. Queue rather than cancel the running
    # one — a half-finished promotion would leave the hotfix on neither branch.
    # A *pending* promotion being dropped by a newer one is harmless: the job
    # always promotes hotfix's tip, which already contains the older commit.
    # Kept separate from promote-dev-to-main so a busy dev promotion queue can
    # never starve a hotfix.
    concurrency:
      group: promote-hotfix
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Open hotfix→main PR and merge when green
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          scripts/promote_when_green.sh \
            --base main --head hotfix \
            --title "hotfix: promote hotfix → main" \
            --body "Automated hotfix promotion — CI passed on \`hotfix\`."

      - name: Open hotfix→dev PR and merge when green
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          scripts/promote_when_green.sh \
            --base dev --head hotfix \
            --title "hotfix: back-merge hotfix → dev" \
            --body "Keeping dev in sync with the hotfix."

  promote_to_main:
    name: Promote dev → main
    runs-on: ubuntu-latest
    needs: [analyze_format, test]
    # Only run when CI passes on a direct push to dev (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    # A hard mutex around the dev→main merge. The workflow-level group above
    # already supersedes an older dev run, but cancellation is asynchronous:
    # two merges landing seconds apart (as #521 and #522 did) could both reach
    # `gh pr merge` on the same PR, and GitHub answers the second with
    # "Merge already in progress" — which used to fail the job and paint dev
    # red even though main got the code.
    #
    # cancel-in-progress: false — never abandon a merge midway. If GitHub drops
    # a *pending* promotion in favour of a newer one that is fine: this job
    # promotes dev's tip, so the newer run carries the older commits too.
    concurrency:
      group: promote-dev-to-main
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Open dev→main PR and merge when green
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          scripts/promote_when_green.sh \
            --base main --head dev \
            --title "chore: promote dev → main" \
            --body "Automated promotion — CI passed on \`dev\`."

  release:
    name: Release — Build & Deploy APK
    runs-on: ubuntu-latest
    # No `needs` on analyze_format/test: those are skipped on push to main
    # (already validated on the dev→main promotion PR), so depending on them
    # here would skip the release. The promotion gate already guards main.
    # Serialize release builds. When two merges to main land in quick
    # succession, both runs would otherwise race to create v<next>.<patch>:
    # the earlier upload wins the release tag, the later (newer-code) upload
    # silently skips, and the new commits never reach a released APK.
    # cancel-in-progress: the latest commit always supersedes any in-flight build.
    concurrency:
      group: release-main
      cancel-in-progress: true
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release): bump version') &&
      !contains(github.event.head_commit.message, 'from jojoneku/release-version-bump-')
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history + tags so the changelog can diff against the last release tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Detect app-code changes
        id: changes
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            if git diff --name-only HEAD~1 HEAD | grep -qvE '^\.github/'; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "Only CI/config files changed — skipping release build."
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-java@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: '17'
          # Cache ~/.gradle (keyed on gradle files) so release APK builds reuse
          # downloaded deps and the build cache instead of starting cold.
          cache: gradle

      - uses: subosito/flutter-action@v2
        if: steps.changes.outputs.changed == 'true'
        with:
          channel: stable
          cache: true

      - name: Create .env file
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> .env

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: flutter pub get

      - name: Compute release metadata
        if: steps.changes.outputs.changed == 'true'
        id: meta
        run: |
          CURRENT=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)

          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -qE '(BREAKING CHANGE|!:)'; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$COMMIT_MSG" | grep -qP '^feat(\(.+\))?:'; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 2100))
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${NEW_VERSION}/app-release.apk"
          MANIFEST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/manifest.json"
          RELEASED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
          echo "manifest_url=$MANIFEST_URL" >> $GITHUB_OUTPUT
          echo "released_at=$RELEASED_AT" >> $GITHUB_OUTPUT

      - name: Bump pubspec version
        if: steps.changes.outputs.changed == 'true'
        run: |
          sed -i "s/^version: .*/version: ${{ steps.meta.outputs.new_version }}+${{ steps.meta.outputs.build_number }}/" pubspec.yaml

      # Build release notes from Conventional Commits since the last release tag,
      # update CHANGELOG.md, and write RELEASE_NOTES.md (used below for the
      # GitHub release + manifest).
      - name: Update changelog & release notes
        if: steps.changes.outputs.changed == 'true'
        run: |
          bash scripts/release_changelog.sh \
            "${{ steps.meta.outputs.new_version }}" \
            "${{ steps.meta.outputs.released_at }}"

      - name: Set up keystore
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 --decode > android/app/nudgr-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../app/nudgr-release.jks
          EOF

      - name: Build APK
        if: steps.changes.outputs.changed == 'true'
        run: |
          flutter build apk --release \
            --build-number=${{ steps.meta.outputs.build_number }} \
            --build-name=${{ steps.meta.outputs.new_version }} \
            --dart-define=UPDATE_MANIFEST_URL=${{ steps.meta.outputs.manifest_url }} \
            --dart-define=APP_VERSION=${{ steps.meta.outputs.new_version }} \
            --dart-define=AI_COACH_ENDPOINT=${{ secrets.AI_COACH_ENDPOINT }}

      - name: Generate manifest.json
        if: steps.changes.outputs.changed == 'true'
        run: |
          python3 -c "
          import json, sys
          notes = open('RELEASE_NOTES.md').read().strip()
          print(json.dumps({
            'version': sys.argv[1],
            'build_number': int(sys.argv[2]),
            'apk_url': sys.argv[3],
            'release_notes': notes,
            'released_at': sys.argv[4]
          }, indent=2))
          " \
            "${{ steps.meta.outputs.new_version }}" \
            "${{ steps.meta.outputs.build_number }}" \
            "${{ steps.meta.outputs.apk_url }}" \
            "${{ steps.meta.outputs.released_at }}" > manifest.json
          cat manifest.json

      - name: Create GitHub Release
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Skip if release already exists
          if gh release view "v${{ steps.meta.outputs.new_version }}" &>/dev/null; then
            echo "Release v${{ steps.meta.outputs.new_version }} already exists, skipping."
            exit 0
          fi

          gh release create "v${{ steps.meta.outputs.new_version }}" \
            --title "v${{ steps.meta.outputs.new_version }}" \
            --notes-file RELEASE_NOTES.md \
            build/app/outputs/flutter-apk/app-release.apk \
            manifest.json

      - name: Commit version bump
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Skip if branch already exists on remote
          if git ls-remote --exit-code --heads origin release-version-bump-${{ steps.meta.outputs.new_version }} &>/dev/null; then
            echo "Branch release-version-bump-${{ steps.meta.outputs.new_version }} already exists, skipping."
            exit 0
          fi

          git checkout -b release-version-bump-${{ steps.meta.outputs.new_version }}
          git add pubspec.yaml CHANGELOG.md
          git commit -m "chore(release): bump version to ${{ steps.meta.outputs.new_version }}+${{ steps.meta.outputs.build_number }}"
          git push -u origin release-version-bump-${{ steps.meta.outputs.new_version }}

      - name: Open PR for version bump
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Check if PR already exists
          pr_number=$(gh pr list -B main -H release-version-bump-${{ steps.meta.outputs.new_version }} \
            --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo "")

          if [ -z "$pr_number" ]; then
            gh pr create -B main -H release-version-bump-${{ steps.meta.outputs.new_version }} \
              --title "chore(release): bump version to ${{ steps.meta.outputs.new_version }}" \
              --body "Automated version bump from release v${{ steps.meta.outputs.new_version }} — CI will ensure required status checks pass before merge." \
              --repo "$GITHUB_REPOSITORY"

            pr_number=$(gh pr list -B main -H release-version-bump-${{ steps.meta.outputs.new_version }} \
              --json number --jq '.[0].number' --repo "$GITHUB_REPOSITORY")
          fi

          # Only attempt auto-merge if PR exists and checks have passed
          if [ -n "$pr_number" ]; then
            gh pr merge "$pr_number" --auto --merge \
              --repo "$GITHUB_REPOSITORY" || true
          fi

  deploy_functions:
    name: Deploy Supabase Edge Functions
    runs-on: ubuntu-latest
    # No analyze_format/test needs — those are skipped on push to main (already
    # gated by the dev→main promotion PR); depending on them would skip deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # fetch-depth 2: the change-detection step below needs HEAD~1. The
      # default shallow depth-1 clone has no HEAD~1, so `git rev-parse HEAD~1`
      # failed and the fallback marked everything changed — this job redeployed
      # on every push to main regardless of what it touched.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes under supabase/functions
        id: changes
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            if git diff --name-only HEAD~1 HEAD | grep -q '^supabase/functions/'; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - uses: supabase/setup-cli@v1
        if: steps.changes.outputs.changed == 'true'
        with:
          version: latest

      - name: Deploy get-hf-token
        if: steps.changes.outputs.changed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy get-hf-token \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

  deploy_lambda:
    name: Deploy AI Coach Lambda
    runs-on: ubuntu-latest
    # No analyze_format/test needs — those are skipped on push to main (already
    # gated by the dev→main promotion PR); depending on them would skip deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # fetch-depth 2: the change-detection step below needs HEAD~1. The
      # default shallow depth-1 clone has no HEAD~1, so `git rev-parse HEAD~1`
      # failed and the fallback marked everything changed — this job redeployed
      # on every push to main regardless of what it touched.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes to backend/ai-coach/
        id: changes
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            if git diff --name-only HEAD~1 HEAD | grep -q '^backend/ai-coach/'; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        if: steps.changes.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Package and deploy Lambda
        if: steps.changes.outputs.changed == 'true'
        run: |
          # Build the deployment package from the canonical source directory.
          # lambda.zip is never committed — always built here from source.
          cd backend/ai-coach
          zip ../../lambda.zip lambda_function.py
          cd ../..
          # Deploy to food-coach-handler — the function the API Gateway
          # (food-coach-api, POST /v1/coach) actually invokes. Deploying to a
          # differently-named function silently ships nothing to production.
          aws lambda update-function-code \
            --function-name food-coach-handler \
            --zip-file fileb://lambda.zip \
            --no-cli-pager
          # Wait until the function is back to Active before exiting,
          # so any follow-up calls (e.g. version publish) don't hit
          # ResourceConflictException.
          aws lambda wait function-updated \
            --function-name food-coach-handler

  deploy_web:
    name: Deploy Treasury Web (Firebase Hosting)
    runs-on: ubuntu-latest
    # No analyze_format/test needs — those are skipped on push to main (already
    # gated by the dev→main promotion PR); depending on them would skip deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      # fetch-depth 2: the change-detection step below needs HEAD~1. The
      # default shallow depth-1 clone has no HEAD~1, so `git rev-parse HEAD~1`
      # failed and the fallback marked everything changed — this job redeployed
      # on every push to main regardless of what it touched.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Only rebuild/deploy when something that affects the web bundle changed.
      - name: Detect web-relevant changes
        id: changes
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            if git diff --name-only HEAD~1 HEAD | grep -qE '^(lib/|web/|assets/|pubspec\.(yaml|lock)|firebase\.json|\.github/workflows/ci\.yml)'; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - uses: subosito/flutter-action@v2
        if: steps.changes.outputs.changed == 'true'
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: flutter pub get

      - name: Create production .env
        if: steps.changes.outputs.changed == 'true'
        run: |
          # Overwrite the committed (localhost) .env. WEB_REDIRECT_URL is left
          # EMPTY so supabase_flutter redirects back to the live deploy origin
          # after Google sign-in — no per-deploy URL to maintain. Only PUBLIC
          # values are written (downloadable in any web build).
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          WEB_REDIRECT_URL=
          EOF

      # Via the script, not a bare `flutter build web`: it drops the service
      # worker and installs the retirement script that un-sticks browsers
      # already holding one. See scripts/build_web.sh for why both halves are
      # needed.
      - name: Build web (Treasury companion)
        if: steps.changes.outputs.changed == 'true'
        run: |
          scripts/build_web.sh \
            --dart-define=AI_COACH_ENDPOINT=${{ secrets.AI_COACH_ENDPOINT }}

      - uses: google-github-actions/auth@v2
        if: steps.changes.outputs.changed == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Verify credential file
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "=== GOOGLE_APPLICATION_CREDENTIALS path ==="
          echo "$GOOGLE_APPLICATION_CREDENTIALS"
          echo "=== Credential file exists ==="
          test -f "$GOOGLE_APPLICATION_CREDENTIALS" && echo "YES" || echo "NO — file missing"
          echo "=== Credential type ==="
          python3 -c "import json; d=json.load(open('$GOOGLE_APPLICATION_CREDENTIALS')); print(d.get('type','MISSING')); print('project_id:', d.get('project_id','n/a')); print('client_email:', d.get('client_email','n/a (not service_account type)'))"
          echo "=== ADC discovery ==="
          python3 -c "
          import google.auth, json
          creds, project = google.auth.default()
          print('ADC project:', project)
          print('ADC creds type:', type(creds).__name__)
          " 2>&1 || echo "ADC discovery failed (google-auth not installed or error above)"

      # firebase-tools authenticates by exchanging the service-account JWT for an
      # access token (POST oauth2/v4/token). Under the runner's default Node 24
      # (gaxios → undici) that request dies mid-stream with "Premature close", so
      # the deploy never authenticates — regardless of which SA / identity setup
      # is used (the credential file the auth step writes is valid; the transport
      # is the problem). Pin Node 20 for this step, where the exchange succeeds.
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 20

      - name: Deploy to Firebase Hosting (live)
        if: steps.changes.outputs.changed == 'true'
        # Use `set -o pipefail` (not a bare `… | tail`) so a failed deploy fails
        # the STEP. The old `… 2>&1 | tail -80` took tail's exit code (always 0),
        # which masked every auth failure as green — the reason broken deploys
        # shipped nothing while CI looked healthy. Retry to ride out any
        # transient token blips; on final failure surface the tail of the log.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx firebase-tools@15.20.0 deploy --only hosting \
                 --project ${{ secrets.FIREBASE_PROJECT_ID }} \
                 --non-interactive --debug 2>&1 | tee deploy.log; then
              echo "Firebase deploy succeeded (attempt $attempt)"
              exit 0
            fi
            echo "::warning::Firebase deploy attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          echo "::error::Firebase deploy failed after 3 attempts"
          tail -n 80 deploy.log
          exit 1
