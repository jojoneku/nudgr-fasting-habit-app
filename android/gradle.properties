# 4G, raised from 2G: R8 minification (:app:minifyReleaseWithR8) died with
# java.lang.OutOfMemoryError on the release build. R8 holds the whole program
# graph in memory, so its footprint tracks total code size — the 2G ceiling had
# been sitting just under the limit and the sync/Realtime work pushed it over.
# CI runners have 16G, and 4G is the usual Android/Flutter recommendation for
# release minification.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapBaseMinAddress=32g
android.useAndroidX=true
# Fix cross-drive path issue on Windows (project on D:, pub cache on C:)
org.gradle.project.buildDir=C:/Users/Eljonblan/AppData/Local/flutter-builds/${rootProject.name}
# Disable Kotlin incremental compilation — required when project (D:) and
# pub cache (C:) are on different drives; incremental cache breaks on Windows
# cross-drive relative path resolution.
kotlin.incremental=false
