<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Treasury — your finances, on the big screen.">

  <!--
    Security headers. The real ones now ship from firebase.json as HTTP response
    headers; what is left here is only the <meta>-safe subset, kept so a build
    served from something other than Firebase Hosting is not completely bare.

    Do not rely on this block. Per the CSP spec browsers IGNORE frame-ancestors
    delivered via <meta>, so for as long as this was the only clickjacking
    protection there was none: the Treasury dashboard was framable by anyone.
    That is what firebase.json fixes.

    The full loading policy (connect-src / script-src for Supabase, Google OAuth,
    gstatic CanvasKit, the coach API and the advisor CloudFront domain) rides in
    firebase.json as Content-Security-Policy-Report-Only. It is NOT enforced yet
    on purpose: a strict CSP is the classic way to white-screen a Flutter web
    app, since CanvasKit is fetched from gstatic and instantiated as wasm. To
    promote it, load the deployed app with the console open, exercise sign-in,
    sync, receipt scan and the advisor, and check for violation reports. When a
    run is clean, move the Report-Only value into Content-Security-Policy and
    delete the Report-Only header.
    (Plan 052 S3)
  -->
  <meta http-equiv="Content-Security-Policy"
        content="frame-ancestors 'none'; base-uri 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nudgr">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nudgr</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
