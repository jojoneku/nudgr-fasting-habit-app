AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI Coach Lambda — Python 3.12, proxies to Amazon Bedrock Claude Haiku

# ⚠️  THIS TEMPLATE DOES NOT DESCRIBE PRODUCTION.
#
# Production runs the Lambda `food-coach-handler` behind the HTTP API
# `food-coach-api` at POST /v1/coach. This template provisions `ai-coach` /
# `ai-coach-api` at POST /coach — different resources entirely. CI
# (deploy_lambda in .github/workflows/ci.yml) only pushes function CODE to
# `food-coach-handler`; nothing here has ever been applied to production.
#
# So do not read anything below as a statement about the live system. In
# particular the CorsConfiguration further down is NOT in effect on
# food-coach-api, which is what made every browser call to the advisor fail its
# CORS preflight — reported by Dart as "check your connection", on a connection
# that was fine. scripts/check_api_cors.sh now asserts the real API instead.
#
# Two consequences worth keeping in mind before editing:
#   * `sam deploy` from here creates a SECOND stack alongside production rather
#     than updating it. Changing the names below to production's would make SAM
#     try to create resources that already exist, which fails — adopting them
#     needs `sam deploy` with an import, not a rename.
#   * Anything that must reach production has to be applied to the live
#     resources (console or CLI) and, ideally, asserted in CI.

Parameters:
  SupabaseProjectRef:
    Type: String
    Description: >
      Supabase project reference ID (the subdomain before .supabase.co).
      Used to construct the JWT authorizer issuer URL and the rate-limit RPC URL.
  SupabaseAnonKey:
    Type: String
    NoEcho: true
    Description: >
      Supabase anon (public) API key. Sent as the PostgREST `apikey` header when
      calling the increment_ai_usage rate-limit RPC. Not secret — already shipped
      in the client app — but marked NoEcho to keep it out of CloudFormation logs.
  DailyCap:
    Type: Number
    Default: 100
    Description: Maximum Bedrock requests per user per day (rate limiting).
  AdvisorModelId:
    Type: String
    Default: global.anthropic.claude-sonnet-4-5-20250929-v1:0
    Description: >
      Bedrock model (cross-region inference profile) used ONLY by the
      adviseFinance op — a stronger model for financial reasoning. Verified
      access-granted and invocable from ap-southeast-1 (2026-07-22). Sonnet 5
      (global.anthropic.claude-sonnet-5) was NOT access-granted on this account;
      request access in the Bedrock console if you want to upgrade later.
  AdvisorMaxTokens:
    Type: Number
    Default: 3000
    Description: >
      Max output tokens for the adviseFinance op. This is a BACKSTOP, not the
      answer-length budget: the real budget is stated to the model in the
      FORMATTING section of _ADVISOR_SYSTEM_PREFIX (~900 words), because
      max_tokens is a ceiling the model cannot see — it writes as though it has
      unlimited room and is then cut mid-word. Telling it the limit is what
      makes answers END; this number only decides what happens when it
      overshoots anyway.
      Why 3000 and not higher: adviseFinance is a blocking invoke_model behind
      an AWS::Serverless::HttpApi, whose integration timeout is capped at 30s
      and cannot be raised. The binding constraint is therefore wall-clock, not
      tokens. 3000 is the largest value observed to complete inside that window
      (answers were seen truncated AT 3000, so 3000 tokens were emitted and the
      request still returned). Above it the failure mode flips from a clipped
      answer to a 504 carrying nothing, which is strictly worse. Sonnet 4.5
      permits 64000 and the general guidance for non-streaming calls is ~16000,
      but that is sized for a 10-minute SDK timeout, not a 30-second gateway.
      Raising this only becomes meaningful alongside
      invoke_model_with_response_stream on a Lambda Function URL. Until then,
      size it from the latency_ms and out_tokens now on every adviseFinance
      cost_line.
      Production sets this env var directly (there is no stack) — see the
      warning at the top of this file.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        BEDROCK_MODEL_ID: anthropic.claude-haiku-20240307-v1:0
        ADVISOR_MODEL_ID: !Ref AdvisorModelId
        ADVISOR_MAX_TOKENS: !Ref AdvisorMaxTokens
        MAX_TOKENS: '1024'
        DAILY_CAP: !Ref DailyCap
        SUPABASE_URL: !Sub 'https://${SupabaseProjectRef}.supabase.co'
        SUPABASE_ANON_KEY: !Ref SupabaseAnonKey

Resources:
  # ── Lambda function ──────────────────────────────────────────────────────────
  # Rate limiting is enforced via the Supabase `increment_ai_usage` RPC (see
  # docs/supabase_migration.sql) — no AWS-side datastore needed.
  AiCoachFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ai-coach
      Handler: lambda_function.lambda_handler
      CodeUri: .
      Policies:
        - Statement:
            # Scoped to Anthropic models only. Covers the Haiku base model plus
            # the stronger advisor model (AdvisorModelId), which may be a
            # cross-region inference profile (apac.anthropic.*) — those invoke the
            # underlying foundation model in another APAC region, so both the
            # foundation-model (any region) and inference-profile ARNs are allowed.
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - arn:aws:bedrock:*::foundation-model/anthropic.*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
      Events:
        CoachPost:
          Type: HttpApi
          Properties:
            Path: /coach
            Method: POST
            ApiId: !Ref AiCoachApi

  # ── HTTP API with Supabase JWT authorizer ────────────────────────────────────
  AiCoachApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: ai-coach-api
      Auth:
        Authorizers:
          # IMPORTANT: the Supabase project's JWT signing key MUST be RSA (RS256).
          # API Gateway's native HTTP API JWT authorizer cannot validate ES256/ECDSA
          # tokens — an ECC signing key makes every otherwise-valid token 401 with
          # {"message":"Unauthorized"} (Supabase Dashboard → Auth → JWT Keys).
          SupabaseJWT:
            JwtConfiguration:
              issuer: !Sub 'https://${SupabaseProjectRef}.supabase.co/auth/v1'
              audience:
                - authenticated
            IdentitySource: "$request.header.Authorization"
        DefaultAuthorizer: SupabaseJWT
      # NOT in effect on production — see the warning at the top of this file.
      # The live food-coach-api needs the equivalent applied directly, from the
      # committed cors.json beside this file:
      #   aws apigatewayv2 update-api --api-id API_ID --region ap-southeast-1       #     --cors-configuration file://backend/ai-coach/cors.json
      # By file, not inline shorthand: AllowOrigins=a,AllowHeaders=b cannot
      # express a list unambiguously (the comma separates keys and values), and
      # inline JSON loses its quotes through PowerShell.
      # Authorization has to be named explicitly: a wildcard does not cover it
      # once the request is authenticated, and every call carries a bearer token.
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - POST
          - OPTIONS

Outputs:
  AiCoachApiUrl:
    Description: AI Coach API endpoint URL
    Value: !Sub 'https://${AiCoachApi}.execute-api.ap-southeast-1.amazonaws.com/coach'
    Export:
      Name: AiCoachApiUrl

  AiCoachFunctionArn:
    Description: AI Coach Lambda function ARN
    Value: !GetAtt AiCoachFunction.Arn
